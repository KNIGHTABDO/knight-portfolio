<!doctype html>
<meta charset="utf-8">
<title>The Knight's Move · hero film</title>
<style>body{margin:0;background:#242321;display:grid;place-items:center;min-height:100vh}canvas{max-width:100vw;max-height:100vh;object-fit:contain;background:#fff}</style>
<canvas id="c"></canvas>
<script src="font.js"></script>
<script src="core.js"></script>

<script>
'use strict';
/* ------------------------------------------------------------------------
Film brief — "The Knight's Move" (hero loop for knightabdo's portfolio)

Subject and beat: a pencil chess knight keeps pace with a moving ECG strip.
  Every beat's R-wave is a hurdle; the knight sizes it up, crouches, leaps,
  lands and settles. Medicine is the paper, the knight is the maker.
Duration: 8 s seamless loop (4 hops x 2 s). 16:9 primary (1920), 9:16 alternate.
Look: pencil (whole drawings, graphite) + riso separations (yellow halftone
  body, fluorescent-pink trace, blue construction dots). White paper so the
  page multiplies the film onto its own paper: white disappears, graphite and
  ink print like ink.
Material bindings: grid, torn edges and trace belong to the strip (world
  space, periodic every 1440 units). Knight marks belong to each drawing.
  No screen texture: the site owns the paper grain.
Cast: one Staunton knight facing right. Drawings are authored once as a master
  contour, then each pose is a whole drawing built from that master with a
  bending neck, squash/stretch that spares the wooden base, lean and tilt;
  every exposed drawing compiles its own pencil marks and holds them.
Exposure: holds while resting; anticipation and settle on twos; the jump on
  ones (fast action, root travels with each new drawing).
Camera: the paper feeds at a constant 25 mm/s equivalent (180 u/s) on ones;
  the knight's rest drifts back on screen, the jump overtakes the feed.
Beat sheet per hop (48 frames): 0-11 rest (hop 1 and 3 blink, hop 2 looks up
  at the wave) · 12-21 crouch on twos · 22 push · 23-34 flight on ones with a
  dotted arc · 28 the R-wave it clears pulses · 35-37 landing squash, dust ·
  38-43 settle on twos · 44-47 rest.
Sources: skill engine (MIT, see LICENSE-hand-drawn-canvas); Caveat (OFL).
------------------------------------------------------------------------ */

const FACE = new FontFace('FilmHand', `url(${FILM_FONT_URL})`);
document.fonts.add(FACE);
_photoLoads.push(FACE.load());

const INK = {
    graphite: '#3a332d',
    pink: '#ff48b0',
    blue: '#0078bf',
    yellow: '#ffe800',
    stripPaper: '#fffaf1'
};
const D = 360;              // hop distance (3 big ECG squares)
const CYCLE = 2;            // seconds per hop
const HOPS = 4;
const TILE = D * HOPS;      // strip period in world units
const FEED = D / CYCLE;     // paper feed speed, units / s
const LIFT = 236;           // jump apex
const TAKEOFF = 22, LANDING = 35;

// ---------- periodic helpers (the strip must wrap seamlessly) ----------
const pnoise = (x, period, seed) => {
    const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
    const m = k => ((k % period) + period) % period;
    return lerp(hash(m(i), seed) * 2 - 1, hash(m(i + 1), seed) * 2 - 1, u);
};

// ---------- the ECG trace (world x, baseline 0, up is negative) ----------
const gauss = (x, mu, s) => Math.exp(-((x - mu) ** 2) / (2 * s * s));
function ecgY(x) {
    const u = ((x % D) + D) % D - D / 2;       // R peak at D/2 of every hop
    return -18 * gauss(u, -82, 14)
        + 11 * gauss(u, -15, 4.5)
        - 150 * gauss(u, 0, 6.2)
        + 32 * gauss(u, 13, 5)
        - 30 * gauss(u, 86, 20);
}

// ---------- the knight: master drawing, facing right, base bottom at (0,0) ----------
const M = {
    back: [[-46, -40], [-54, -70], [-60, -110], [-62, -150], [-56, -190], [-44, -222], [-28, -248], [-14, -266]],
    ear: [[-14, -266], [-11, -286], [-3, -303], [5, -287], [8, -270]],
    brow: [[8, -270], [26, -262], [46, -249], [64, -231], [80, -211]],
    nose: [[80, -211], [94, -193], [104, -177], [109, -164]],
    muzzle: [[109, -164], [107, -154], [99, -149], [86, -151]],
    jaw: [[86, -151], [74, -156], [60, -162], [46, -164]],
    throat: [[46, -164], [36, -158], [30, -146], [32, -130]],
    chest: [[32, -130], [42, -110], [50, -88], [50, -64], [44, -40]],
    collarTop: [[-58, -42], [-30, -37.5], [0, -36], [30, -37.5], [58, -42]],
    collarL: [[-58, -42], [-60, -34], [-59, -27]],
    collarR: [[58, -42], [60, -34], [59, -27]],
    collarBead: [[-59, -27], [-30, -22.5], [0, -21.5], [30, -22.5], [59, -27]],
    footBackL: [[-86, -23], [-74, -28], [-60, -30]],
    footBackR: [[86, -23], [74, -28], [60, -30]],
    footTop: [[-86, -23], [-44, -17.5], [0, -16], [44, -17.5], [86, -23]],
    footL: [[-86, -23], [-88.5, -13], [-86, -4]],
    footR: [[86, -23], [88.5, -13], [86, -4]],
    footBottom: [[-86, -4], [-44, 1.6], [0, 3], [44, 1.6], [86, -4]],
    eye: [[30, -233], [36, -238.5], [44, -237], [47, -231.5], [40, -228], [32, -229.5], [30, -233]],
    lid: [[29, -232], [36, -231], [43, -231], [47.5, -232.5]],
    browRidge: [[24, -243], [37, -248], [51, -243]],
    nostril: [[91, -181], [96, -186], [101, -180], [96, -175]],
    mouth: [[106, -157.5], [97, -158.5], [88, -157]],
    cheek: [[30, -214], [50, -207], [63, -192], [66, -174], [58, -163]],
    earInner: [[-7, -272], [-3, -292], [1, -277]]
};
// shift so the lowest point of the foot (0, 3) sits on the line
for (const pts of Object.values(M)) for (const p of pts) p[1] -= 3;

const SIL = [
    ...M.back, ...M.ear.slice(1), ...M.brow.slice(1), ...M.nose.slice(1), ...M.muzzle.slice(1),
    ...M.jaw.slice(1), ...M.throat.slice(1), ...M.chest.slice(1),
    [58, -45], [60, -30], [86, -26], [88.5, -16], [86, -7], [44, -1.4], [0, 0], [-44, -1.4], [-86, -7], [-88.5, -16], [-86, -26], [-60, -30], [-58, -45]
];
function inside(pts, x, y) {
    let o = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const [xi, yi] = pts[i], [xj, yj] = pts[j];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) o = !o;
    }
    return o;
}
// Carved mane: a ridge inset from the back, notched, with grooves out to the contour.
const backPath = motionPath(M.back.slice(1).concat([M.ear[1]]));
const MANE = [], GROOVES = [];
for (let i = 0; i <= 14; i++) {
    const u = .02 + i / 14 * .9, a = backPath.at(u), n = [a.tangent[1], -a.tangent[0]];
    const inset = i % 2 ? 11 : 20;
    MANE.push([a.p[0] - n[0] * inset, a.p[1] - n[1] * inset]);
    if (i % 2 === 0 && i > 0 && i < 14) GROOVES.push([[a.p[0] - n[0] * 19, a.p[1] - n[1] * 19], [a.p[0] - n[0] * 5 + a.tangent[0] * 4, a.p[1] - n[1] * 5 + a.tangent[1] * 4]]);
}
// Shadow hatching: light comes from the upper right, so the back of the neck,
// under the jaw and the left of the base carry graphite. Grid ids keep them stable.
const HATCH = [];
for (let gy = -250; gy <= -50; gy += 7) for (let gx = -60; gx <= 40; gx += 7) {
    const id = (gx + 100) * 1000 + (gy + 400), jx = (hash(id, 3) - .5) * 5, jy = (hash(id, 4) - .5) * 5;
    const x = gx + jx, y = gy + jy;
    const edge = backPath.at(clamp((-y - 45) / 235, 0, 1)).p[0];
    const t = clamp(1 - (x - edge) / 46, 0, 1) * clamp((-y - 50) / 30, 0, 1);
    const underJaw = y > -175 && y < -140 && x > 22 && x < 60 ? .55 : 0;
    const tone = Math.max(t * .92, underJaw);
    if (hash(id, 5) > tone || !inside(SIL, x, y) || !inside(SIL, x + 9, y - 12)) continue;
    const L = 9 + hash(id, 6) * 8;
    HATCH.push([[x, y], [x + L * .42, y - L * .68], [x + L * .62, y - L]]);
}
for (let gx = -84; gx <= -26; gx += 5.5) {
    const k = Math.round(gx * 10), fade = clamp((-26 - gx) / 50, 0, 1);
    if (hash(k, 7) > fade + .15) continue;
    HATCH.push([[gx, -20 + hash(k, 8) * 3], [gx - .6, -12], [gx - 1, -6 - hash(k, 9) * 2]]);
    if (gx > -58 && hash(k, 10) < fade) HATCH.push([[gx + 2, -40], [gx + 1.6, -35], [gx + 1.2, -30]]);
}

// Pose: a whole drawing from the master. The neck bends (the head leads),
// squash/stretch spares the wooden base, lean shears forward, tilt is for flight.
const REST = [1, 1, 0, 0, 0];
const LOOK = [1.02, .99, -.2, -.05, 0];
function deform(p, [sy, sx, nod, lean, rot]) {
    let [x, y] = p;
    const w = easeInOutSine(clamp((-115 - y) / 95, 0, 1)), a = nod * w, px = -6, py = -150;
    const ca = Math.cos(a), sa = Math.sin(a), dx = x - px, dy = y - py;
    x = px + dx * ca - dy * sa; y = py + dx * sa + dy * ca;
    const b = clamp((-10 - y) / 42, 0, 1);
    x *= 1 + (sx - 1) * (.3 + .7 * b);
    y *= sy;
    x += lean * -y;
    if (rot) { const c = Math.cos(rot), s = Math.sin(rot), qx = x, qy = y + 150; x = qx * c - qy * s; y = qx * s + qy * c - 150; }
    return [x, y];
}
const PRESS = [[0, .15], [.14, .85], [.45, 1], [.8, .7], [1, .1]];
function knightRaw(P, blink) {
    const strokes = [], d = pts => pts.map(p => deform(p, P));
    const add = (id, pts, width, opacity = 1, extra = {}) => strokes.push({ id, points: d(pts), width: width * 1.3, opacity, pressure: PRESS, ...extra });
    add('foot/bottom', M.footBottom, 3.1, .95);
    add('foot/l', M.footL, 2.6, .9, { corner: .9 });
    add('foot/r', M.footR, 2.2, .75, { corner: .9 });
    add('foot/top', M.footTop, 2.2, .8);
    add('foot/back-l', M.footBackL, 1.6, .55);
    add('foot/back-r', M.footBackR, 1.4, .45);
    add('collar/bead', M.collarBead, 2.2, .85);
    add('collar/l', M.collarL, 2.2, .85);
    add('collar/r', M.collarR, 1.8, .65);
    add('collar/top', M.collarTop, 2, .8);
    add('back', M.back, 3.4, 1);
    add('back/search', M.back.slice(1, 6).map(([x, y]) => [x - 2.5, y + 2]), 1.1, .3);
    add('ear', M.ear, 2.6, .95, { corner: .7 });
    add('ear/inner', M.earInner, 1.2, .55, { corner: .7 });
    add('brow', M.brow, 3, 1);
    add('nose', M.nose, 3.2, 1);
    add('muzzle', M.muzzle, 3, 1, { corner: 1 });
    add('jaw', M.jaw, 2.6, .9);
    add('throat', M.throat, 2.4, .85);
    add('chest', M.chest, 3, .95);
    add('chest/search', M.chest.slice(0, 4).map(([x, y]) => [x + 2.5, y + 1]), 1, .28);
    add('cheek', M.cheek, 1.5, .55);
    add('mane', MANE, 1.7, .75, { corner: .5 });
    GROOVES.forEach((g, i) => add('mane/groove/' + i, g, 1.2, .5));
    HATCH.forEach((h, i) => add('hatch/' + i, h, 1.1, .6 + hash(i, 12) * .25, { pressure: [[0, .3], [.5, 1], [1, .2]] }));
    add('nostril', M.nostril, 1.7, .85);
    add('mouth', M.mouth, 1.6, .8);
    if (blink) {
        add('lid/closed', M.lid, 2.4, 1);
        add('lid/lash', [[42, -234], [45, -228], [47, -226]], 1.1, .7);
    } else {
        add('eye', M.eye, 2.1, 1);
        add('brow-ridge', M.browRidge, 1.3, .6);
        for (let k = 0; k < 3; k++) {
            const r = 3.2 - k * .9, cx = 40.5, cy = -236.3;
            add('pupil/' + k, [[cx - r, cy], [cx, cy - r], [cx + r, cy], [cx, cy + r], [cx - r, cy]], 1.5, 1, { pressure: [[0, 1], [1, 1]] });
        }
    }
    return { strokes };
}

// ---------- exposure: which whole drawing each cycle frame shows ----------
const KEYS = start => [
    [12, ...start],
    [18, .84, 1.1, .22, -.06, 0],
    [22, 1.16, .9, -.1, .14, -.05],
    [26, 1.08, .95, -.16, .05, -.12],
    [29, 1.0, 1.0, -.02, 0, 0],
    [34, 1.06, .96, .12, -.02, .12],
    [35, .8, 1.16, .26, .07, 0],
    [38, .83, 1.13, .22, .05, 0],
    [41, 1.045, .98, -.06, 0, 0],
    [44, ...REST]
];
const VARIANT = ['plain', 'blink', 'look', 'blink-late'];
function knightFrame(n, f) {
    const v = VARIANT[n], startPose = v === 'look' ? LOOK : REST, sk = v === 'look' ? 'L' : 'R';
    const K = KEYS(startPose);
    const at = g => key(g, K, easeInOutSine);
    let id, P, blink = false;
    if (f < 12) {
        id = 'rest'; P = REST;
        if (v === 'blink' && f >= 4 && f <= 6) { id = 'rest-blink'; blink = true; }
        if (v === 'blink-late' && f >= 7 && f <= 9) { id = 'rest-blink'; blink = true; }
        if (v === 'look') {
            if (f >= 2 && f < 4) { id = 'look-1'; P = REST.map((r, k) => lerp(r, LOOK[k], .4)); }
            else if (f >= 4 && f < 6) { id = 'look-2'; P = REST.map((r, k) => lerp(r, LOOK[k], .82)); }
            else if (f >= 6) { id = 'look'; P = LOOK; }
            if (f === 9 || f === 10) { id = 'look-blink'; blink = true; }
        }
    } else if (f < TAKEOFF) {
        const g = 12 + 2 * Math.floor((f - 12) / 2);
        id = sk + '-crouch-' + g; P = at(g);
    } else if (f < LANDING) {
        id = 'air-' + f; P = at(f);
    } else if (f < 38) {
        id = 'land'; P = at(LANDING);
    } else if (f < 44) {
        const g = 38 + 2 * Math.floor((f - 38) / 2);
        id = 'settle-' + g; P = at(g + 1);
    } else { id = 'rest'; P = REST; }
    const u = f < TAKEOFF ? 0 : f >= LANDING ? 1 : (f - TAKEOFF) / (LANDING - TAKEOFF);
    return { id, P, blink, u };
}

// ---------- drawing caches (one sprite per drawing per output scale) ----------
const SPR = 2;              // sprite supersampling relative to S
const BOX = [-190, -420, 400, 470];
const sprites = new Map();
function knightSprite(fr) {
    const k = S + '/' + fr.id;
    if (sprites.has(k)) return sprites.get(k);
    const cel = compileCel(knightRaw(fr.P, fr.blink), { id: fr.id });
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(BOX[2] * S * SPR); cv.height = Math.ceil(BOX[3] * S * SPR);
    const g = cv.getContext('2d');
    g.scale(S * SPR, S * SPR); g.translate(-BOX[0], -BOX[1]);
    // riso yellow separation, a little off register from the pencil
    const sil = SIL.map(p => deform(p, fr.P));
    const off = polyPath(smoothPts(sil.map(([x, y]) => [x + 7, y - 5]), true, 3, 1.2));
    dotScreen(g, off, [-150, -370, 320, 400], { cell: 6.2, color: INK.yellow, density: .56, angle: .26, jitter: .12, seed: 21, alpha: 1 });
    // a lighter blue separation only in the shadow side: overprints to green
    dotScreen(g, off, [-150, -370, 320, 400], { color: INK.blue, cell: 6.2, density: (x, y) => clamp((-10 - x) / 70, 0, 1) * .3 * clamp((-y - 40) / 60, 0, 1), angle: 1.31, jitter: .12, seed: 22, alpha: .9 });
    drawCel(g, cel, { material: 'pencil', color: INK.graphite });
    drawCel(g, cel, { material: 'ink', color: INK.graphite, opacity: .34 });
    sprites.set(k, cv);
    return cv;
}

// The strip: torn cream paper with a hand-ruled ECG grid and the trace, one period.
let stripLayer = null, stripScale = 0;
const STRIP_TOP = -268, STRIP_BOT = 104;
const edgeTop = x => STRIP_TOP + 6 * pnoise(x / 30, TILE / 30, 41) + 2.5 * pnoise(x / 7, TILE / 7, 42);
const edgeBot = x => STRIP_BOT + 5 * pnoise(x / 34, TILE / 30, 43) + 2 * pnoise(x / 6, TILE / 6, 44);
function buildStrip() {
    const PAD = 60, h = 460, y0 = -330;
    const L = document.createElement('canvas');
    L.width = Math.round(TILE * S); L.height = Math.round(h * S);
    const g = L.getContext('2d');
    g.scale(S, S); g.translate(0, -y0);
    const xs = []; for (let x = -PAD; x <= TILE + PAD; x += 3) xs.push(x);
    const top = xs.map(x => [x, edgeTop(x)]), bot = xs.map(x => [x, edgeBot(x)]);
    const shape = polyPath([...top, ...bot.slice().reverse()]);
    g.fillStyle = INK.stripPaper; g.fill(shape);
    // a quiet pencil tone along the torn edges, like the paper curling
    g.save(); g.clip(shape);
    g.strokeStyle = INK.graphite; g.lineCap = 'round';
    for (let x = -PAD; x < TILE + PAD; x += 4.5) {
        const k = Math.round(((x % TILE) + TILE) % TILE * 10);
        if (hash(k, 51) < .5) { g.globalAlpha = .1 + hash(k, 52) * .08; g.lineWidth = .8; g.beginPath(); const y = edgeTop(x); g.moveTo(x, y + 1); g.lineTo(x + 3, y + 5 + hash(k, 53) * 7); g.stroke(); }
        if (hash(k, 54) < .5) { g.globalAlpha = .1 + hash(k, 55) * .08; g.lineWidth = .8; g.beginPath(); const y = edgeBot(x); g.moveTo(x, y - 1); g.lineTo(x + 3, y - 5 - hash(k, 56) * 7); g.stroke(); }
    }
    g.restore();
    // hand-ruled grid: 1 mm = 24 u, 5 mm = 120 u; slightly bowed, periodic
    g.save(); g.clip(shape);
    const rule = (x0, y0, x1, y1, seed, big) => {
        g.lineWidth = big ? 1.35 : .7; g.globalAlpha = big ? .34 : .17; g.strokeStyle = INK.pink;
        g.beginPath();
        const n = 24;
        for (let i = 0; i <= n; i++) {
            const t = i / n, x = lerp(x0, x1, t), y = lerp(y0, y1, t), wob = .7 * Math.sin(t * Math.PI) * (hash(seed, 60) - .5) * 2;
            i ? g.lineTo(x + (x0 === x1 ? wob : 0), y + (y0 === y1 ? wob : 0)) : g.moveTo(x, y);
        }
        g.stroke();
    };
    for (let x = -PAD - (PAD % 24); x <= TILE + PAD; x += 24) {
        const id = ((Math.round(x / 24) % 60) + 60) % 60; rule(x, STRIP_TOP - 12, x, STRIP_BOT + 12, id, id % 5 === 0);
    }
    for (let y = 0 - 24 * 11; y <= STRIP_BOT + 12; y += 24) {
        const id = Math.round(y / 24) + 20; rule(-PAD, y, TILE + PAD, y, 200 + id, (Math.round(y / 24) % 5 + 5) % 5 === 0);
    }
    g.restore();
    // lead label and calibration header in pencil
    g.save(); g.fillStyle = INK.graphite; g.globalAlpha = .72; g.font = '34px FilmHand';
    g.fillText('II', 1084, -196);
    g.font = '27px FilmHand'; g.globalAlpha = .55;
    g.fillText('25 mm/s · 10 mm/mV', 440, 78);
    g.fillText('knight, abdo — lead II', 1150, 78);
    g.restore();
    // the trace: fluorescent pink riso ink, two passes that do not quite agree
    const tr = []; for (let x = -PAD; x <= TILE + PAD; x += 1.5) tr.push([x, ecgY(x)]);
    g.save(); g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = INK.pink;
    g.globalAlpha = .95; g.lineWidth = 3.4; g.stroke(polyPath(tr, false));
    g.globalAlpha = .35; g.lineWidth = 1.4; g.stroke(polyPath(tr.map(([x, y]) => [x + 1.6, y - 1.8 + pnoise(x / 40, TILE / 40, 71) * 1.2]), false));
    g.restore();
    // pencil torn-edge contour on top
    g.save(); g.strokeStyle = INK.graphite; g.lineWidth = 1.3; g.globalAlpha = .55; g.lineJoin = 'round';
    g.stroke(polyPath(top, false)); g.stroke(polyPath(bot, false));
    g.restore();
    return { canvas: L, y0, h };
}

// ---------- marks that belong to single moments ----------
function shadowMark(c, x, lift) {
    const k = clamp(1 - lift / 330, .35, 1), rx = 96 * k, ry = 9 * k;
    c.save(); c.strokeStyle = INK.graphite; c.lineCap = 'round'; c.globalAlpha = .28 * k; c.lineWidth = 1;
    c.beginPath();
    for (let i = 0; i < 26; i++) {
        const t = i / 25 * 2 - 1, xx = x + t * rx, hh = ry * Math.sqrt(1 - t * t);
        c.moveTo(xx - 4, 9 + hh * .8); c.lineTo(xx + 5, 9 - hh * .6);
    }
    c.stroke(); c.restore();
}
function jumpDots(c, x0, upto, alpha) {
    c.save(); c.fillStyle = INK.blue; c.globalAlpha = alpha;
    c.beginPath();
    for (let k = 1; k < 30; k++) {
        const u = k / 30; if (u > upto) break;
        const x = x0 + u * D, y = -LIFT * 4 * u * (1 - u) - 4;
        c.moveTo(x + 2.8, y); c.arc(x, y, 2.8, 0, TAU);
    }
    c.fill(); c.restore();
}
function beatPulse(c, xR, big) {
    // the cleared R-wave beats: a second, heavier pink pass and short graphite rays
    const pts = []; for (let x = xR - 26; x <= xR + 26; x += 1) pts.push([x, ecgY(x)]);
    c.save(); c.strokeStyle = INK.pink; c.lineWidth = big ? 6 : 4.6; c.globalAlpha = .9; c.lineJoin = 'round'; c.lineCap = 'round';
    c.stroke(polyPath(pts, false));
    c.strokeStyle = INK.graphite; c.lineWidth = 2; c.globalAlpha = .7;
    c.beginPath();
    for (let k = 0; k < 7; k++) {
        const a = -Math.PI / 2 + (k - 3) * .42, r0 = big ? 22 : 16, r1 = big ? 44 : 30, cy = -153;
        c.moveTo(xR + Math.cos(a) * r0, cy + Math.sin(a) * r0);
        c.lineTo(xR + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    }
    c.stroke(); c.restore();
}
function landingDust(c, x, f) {
    const k = f - LANDING, spread = k < 3 ? 1 : 1.45;
    c.save(); c.strokeStyle = INK.graphite; c.lineCap = 'round'; c.lineWidth = 1.8; c.globalAlpha = k < 3 ? .75 : .45;
    c.beginPath();
    for (const s of [-1, 1]) for (let j = 0; j < 3; j++) {
        const a = (s < 0 ? Math.PI : 0) + s * (-.25 - j * .38), r0 = 100 * spread, r1 = r0 + 20 - j * 4;
        c.moveTo(x + Math.cos(a) * r0 * (s < 0 ? 1 : 1), -8 + Math.sin(a) * r0 * .35);
        c.lineTo(x + Math.cos(a) * r1, -8 + Math.sin(a) * r1 * .35);
    }
    c.stroke(); c.restore();
}

// ---------- the shot ----------
function layout() {
    if (W / H > 1.3) return { base: H * .8, anchor: W * .64, scale: 1.1 };
    if (W >= H) return { base: H * .78, anchor: W * .52, scale: 1 };
    return { base: H * .79, anchor: W * .5, scale: .98 };
}
function shot(c, tau) {
    resetT(c); c.fillStyle = '#ffffff'; c.fillRect(0, 0, W, H);
    if (!stripLayer || stripScale !== S) { stripLayer = buildStrip(); stripScale = S; }
    const { base, anchor, scale } = layout();
    const t = ((tau % (CYCLE * HOPS)) + CYCLE * HOPS) % (CYCLE * HOPS);
    const n = Math.floor(t / CYCLE + 1e-9), f = clamp(Math.floor((t - n * CYCLE) * 24 + 1e-6), 0, 47);
    const camX = FEED * t - 30;
    c.save();
    c.translate(anchor, base); c.scale(scale, scale); c.translate(-camX, 0);
    // strip tiles
    const left = camX - anchor / scale - TILE, right = camX + (W - anchor) / scale + TILE;
    for (let k = Math.floor(left / TILE); k * TILE < right; k++) {
        c.drawImage(stripLayer.canvas, k * TILE, stripLayer.y0, TILE, stripLayer.h);
    }
    const fr = knightFrame(n, f);
    const x0 = n * D, kx = x0 + fr.u * D, ky = -LIFT * 4 * fr.u * (1 - fr.u);
    // construction arc: drawn as it flies, held a moment after the landing
    if (f >= TAKEOFF && f < 44) jumpDots(c, x0, f < LANDING ? fr.u + .02 : 1, f < 40 ? .85 : .45);
    if (f >= 28 && f < 36) beatPulse(c, x0 + D / 2, f >= 32);
    shadowMark(c, kx, -ky);
    if (f >= LANDING && f < 41) landingDust(c, kx, f);
    const spr = knightSprite(fr);
    c.drawImage(spr, kx + BOX[0], ky + BOX[1], BOX[2], BOX[3]);
    c.restore();
}

defineFilm({
    palette: { ...PALETTES.pencilMinimal, paper: '#ffffff' },
    format: { ar: '16:9', width: 1920 },
    fps: 24,
    timeline: [{ name: 'the-knights-move', dur: CYCLE * HOPS, fn: shot }]
});
